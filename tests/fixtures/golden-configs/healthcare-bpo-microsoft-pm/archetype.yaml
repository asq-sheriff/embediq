id: healthcare-bpo-microsoft-pm
title: Healthcare BPO — Microsoft / Azure stack, Product Manager
description: |
  Product manager working alongside the engineering team at a healthcare
  business process outsourcing firm whose stack is C# / Python / Java
  shipped through Azure DevOps. PHI exposure is real but the PM's daily
  work is requirements, prioritization, and cross-stakeholder
  coordination — not hands-on code.

  This archetype exercises the role-adaptive output path on the
  Microsoft-Azure stack: non-technical role (pm) → coworker-shaped
  CLAUDE.md, skips technical generators (hooks, association map). The
  healthcare domain pack still applies (HIPAA compliance scaffolding),
  but tailored to a PM's day-to-day.

  Sibling: `healthcare-bpo-microsoft-developer` (developer persona on
  the same stack). Together they verify the role-aware output axis on
  the Microsoft-Azure-stack healthcare BPO.
minimumFloor: 18
