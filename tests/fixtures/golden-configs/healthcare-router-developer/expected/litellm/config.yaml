# LiteLLM gateway — compiled from EmbedIQ routing policy 1.0.0.
# Pin a signed, immutable LiteLLM proxy image tag before production use.
# Guardrails (PHI/PII egress filtering) render from the compliance skill payload — see the router runbook.

model_list:
  - model_name: local-qwen2.5-coder:32b                 # locality: local, covered: [none]
    litellm_params:
      model: ollama/qwen2.5-coder:32b
      api_base: os.environ/OLLAMA_HOST
  - model_name: local-nomic-embed-text                 # locality: local, covered: [none]
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_HOST

guardrails:
  - guardrail_name: embediq-phi-egress
    litellm_params:
      guardrail: guardrails.embediq_phi_egress.EmbedIQPhiEgress
      mode: pre_call
      default_on: true
