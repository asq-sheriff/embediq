id: healthcare-bpo-microsoft-developer
title: Healthcare BPO — Microsoft / Azure stack, Developer
description: |
  Software engineer at a healthcare business process outsourcing firm
  building services on a Microsoft-Azure enterprise stack: C# / Python /
  Java (ASP.NET Core, FastAPI, Spring Boot), shipped through Azure DevOps,
  processing PHI on behalf of payer clients. Full HIPAA + HITECH
  obligations, large team, strict permission envelope.

  One of two canonical healthcare-BPO archetypes:
    - this one: C# / Python / Java / dotnet+pip+maven / Azure DevOps
    - sibling:  TypeScript / Python / npm / GitHub Actions (web stack)
                (`healthcare-bpo-web-developer`)

  Together these cover the two dominant stack patterns we see at
  healthcare BPOs. Role-aware output is tested separately via the
  `-pm` variants.
minimumFloor: 18
