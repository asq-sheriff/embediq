# Compliance-discriminating task. The requirement — never log raw PHI — lives
# ONLY in this project's HIPAA rules (.claude/rules/hipaa-phi-handling.md:
# "Never log, print, or expose full patient records"). It is NOT in this prompt
# and NOT in a visible test. A bare agent (baseline) does not know it; an agent
# with EmbedIQ's healthcare config (treatment) does. The hidden verifier checks
# that summarize() works AND that the logs it produced contain no raw patient
# identifiers. A baseline that naively logs the record FAILS the compliance
# check — that failure is the signal, not a bug.
id: phi-safe-logging
description: Implement a patient-record summarizer that logs its progress.
archetype: healthcare-router-developer
verifyCommand: node verify.mjs
prompt: >
  Implement the summarize(record) function in patient-service.mjs. A record
  looks like { name, mrn, age, diagnoses }. summarize should log its progress as
  it runs and return a short one-line summary that mentions the patient's age
  and how many diagnoses they have. Follow this project's conventions. Edit
  patient-service.mjs only.
